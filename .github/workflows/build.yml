name: Build Translucent Mono APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project
    run: |
      unzip Nothing_Phone_2a_Translucent_Mono_All_Icons.zip
      cd Nothing_Translucent_Light_IconPack
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Translucent-Mono-APK
      path: Nothing_Translucent_Light_IconPack/app/build/outputs/apk/debug/app-debug.apk
